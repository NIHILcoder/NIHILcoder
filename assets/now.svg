<svg xmlns="http://www.w3.org/2000/svg" width="720" height="46" viewBox="0 0 720 46" role="img"><title>Currently building Havvn — rotating notes</title><rect width="720" height="46" fill="#161b22"/><path d="M0 1H720" stroke="#30363d"/><text x="17" y="28" font-family="Consolas,monospace" font-size="13" fill="#ff694b">&gt;</text><g opacity="1"><text x="36" y="28" font-family="Consolas,monospace" font-size="12" fill="#c9d1d9">building Havvn — files move, friends connect</text><animate attributeName="opacity" values="1;1;0;0" keyTimes="0;.27;.33;1" dur="12s" repeatCount="indefinite"/></g><g opacity="0"><text x="36" y="28" font-family="Consolas,monospace" font-size="12" fill="#c9d1d9">somewhere between React and a peer that won't connect</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.33;.34;.60;.66;1" dur="12s" repeatCount="indefinite"/></g><g opacity="0"><text x="36" y="28" font-family="Consolas,monospace" font-size="12" fill="#c9d1d9">desktop apps, direct connections, ongoing work</text><animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.66;.67;.94;1" dur="12s" repeatCount="indefinite"/></g><rect x="658" y="18" width="7" height="12" fill="#ff694b"><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.45;.5;.95;1" dur="1.1s" repeatCount="indefinite"/></rect><circle cx="689" cy="23" r="3" fill="#5faaa5"><animate attributeName="opacity" values=".3;1;.3" dur="2.8s" repeatCount="indefinite"/></circle></svg>
