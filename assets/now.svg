<text x="17" y="31" fill="#ff694b" font-family="Consolas,monospace" font-size="13" >&gt;</text>
<g opacity="1"><animate attributeName="opacity" values="1;0;0;0;0;0;1" keyTimes="0;.166667;.333333;.5;.666667;.833333;1" dur="24s" repeatCount="indefinite" calcMode="discrete"/><g clip-path="url(#terminalLine0)"><text x="36" y="31" fill="#e6edf3" font-family="Consolas,monospace" font-size="11.5" textLength="340" lengthAdjust="spacingAndGlyphs">finding peers — every room starts with a handshake</text></g><rect x="38" y="20" width="6" height="12" fill="#ff694b"><animate attributeName="x" values="38;380;380;38;38" keyTimes="0;0.049;0.15467;0.16667;1" dur="24s" repeatCount="indefinite" /><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.45;.5;.95;1" dur="0.8s" repeatCount="indefinite" /></rect><text x="665" y="31" fill="#87939f" font-family="Consolas,monospace" font-size="9" text-anchor="middle">01 / 06</text></g><g opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0;0" keyTimes="0;.166667;.333333;.5;.666667;.833333;1" dur="24s" repeatCount="indefinite" calcMode="discrete"/><g clip-path="url(#terminalLine1)"><text x="36" y="31" fill="#e6edf3" font-family="Consolas,monospace" font-size="11.5" textLength="346.8" lengthAdjust="spacingAndGlyphs">connecting directly — the route is part of the work</text></g><rect x="38" y="20" width="6" height="12" fill="#ff694b"><animate attributeName="x" values="38;38;386.8;386.8;38;38" keyTimes="0;0.16667;0.21567;0.32133;0.33333;1" dur="24s" repeatCount="indefinite" /><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.45;.5;.95;1" dur="0.8s" repeatCount="indefinite" /></rect><text x="665" y="31" fill="#87939f" font-family="Consolas,monospace" font-size="9" text-anchor="middle">02 / 06</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0;0" keyTimes="0;.166667;.333333;.5;.666667;.833333;1" dur="24s" repeatCount="indefinite" calcMode="discrete"/><g clip-path="url(#terminalLine2)"><text x="36" y="31" fill="#e6edf3" font-family="Consolas,monospace" font-size="11.5" textLength="306" lengthAdjust="spacingAndGlyphs">sharing files — bytes belong on your machines</text></g><rect x="38" y="20" width="6" height="12" fill="#ff694b"><animate attributeName="x" values="38;38;346;346;38;38" keyTimes="0;0.33333;0.38233;0.488;0.5;1" dur="24s" repeatCount="indefinite" /><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.45;.5;.95;1" dur="0.8s" repeatCount="indefinite" /></rect><text x="665" y="31" fill="#87939f" font-family="Consolas,monospace" font-size="9" text-anchor="middle">03 / 06</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0;0" keyTimes="0;.166667;.333333;.5;.666667;.833333;1" dur="24s" repeatCount="indefinite" calcMode="discrete"/><g clip-path="url(#terminalLine3)"><text x="36" y="31" fill="#e6edf3" font-family="Consolas,monospace" font-size="11.5" textLength="333.2" lengthAdjust="spacingAndGlyphs">watching together — same frame, different screens</text></g><rect x="38" y="20" width="6" height="12" fill="#ff694b"><animate attributeName="x" values="38;38;373.2;373.2;38;38" keyTimes="0;0.5;0.549;0.65467;0.66667;1" dur="24s" repeatCount="indefinite" /><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.45;.5;.95;1" dur="0.8s" repeatCount="indefinite" /></rect><text x="665" y="31" fill="#87939f" font-family="Consolas,monospace" font-size="9" text-anchor="middle">04 / 06</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0;0" keyTimes="0;.166667;.333333;.5;.666667;.833333;1" dur="24s" repeatCount="indefinite" calcMode="discrete"/><g clip-path="url(#terminalLine4)"><text x="36" y="31" fill="#e6edf3" font-family="Consolas,monospace" font-size="11.5" textLength="346.8" lengthAdjust="spacingAndGlyphs">voice connected — a room starts to feel like a room</text></g><rect x="38" y="20" width="6" height="12" fill="#ff694b"><animate attributeName="x" values="38;38;386.8;386.8;38;38" keyTimes="0;0.66667;0.71567;0.82133;0.83333;1" dur="24s" repeatCount="indefinite" /><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.45;.5;.95;1" dur="0.8s" repeatCount="indefinite" /></rect><text x="665" y="31" fill="#87939f" font-family="Consolas,monospace" font-size="9" text-anchor="middle">05 / 06</text></g><g opacity="0"><animate attributeName="opacity" values="0;0;0;0;0;1;0" keyTimes="0;.166667;.333333;.5;.666667;.833333;1" dur="24s" repeatCount="indefinite" calcMode="discrete"/><g clip-path="url(#terminalLine5)"><text x="36" y="31" fill="#e6edf3" font-family="Consolas,monospace" font-size="11.5" textLength="414.8" lengthAdjust="spacingAndGlyphs">still building Havvn — the interesting part is the edge cases</text></g><rect x="38" y="20" width="6" height="12" fill="#ff694b"><animate attributeName="x" values="38;38;454.8;454.8;38" keyTimes="0;0.83333;0.88233;0.988;1" dur="24s" repeatCount="indefinite" /><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.45;.5;.95;1" dur="0.8s" repeatCount="indefinite" /></rect><text x="665" y="31" fill="#87939f" font-family="Consolas,monospace" font-size="9" text-anchor="middle">06 / 06</text></g>
