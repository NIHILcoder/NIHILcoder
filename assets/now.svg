<svg xmlns="http://www.w3.org/2000/svg" width="720" height="54" viewBox="0 0 720 54" role="img"><title>Havvn — a terminal follows the room lifecycle</title><desc>Six typed status lines follow the phases of the animated header.</desc><defs><clipPath id="terminalLine0"><rect x="35" y="11" width="340" height="29"><animate attributeName="width" values="0;340;340;0;0" keyTimes="0;0.049;0.15467;0.16667;1" dur="24s" repeatCount="indefinite" /></rect></clipPath><clipPath id="terminalLine1"><rect x="35" y="11" width="0" height="29"><animate attributeName="width" values="0;0;346.8;346.8;0;0" keyTimes="0;0.16667;0.21567;0.32133;0.33333;1" dur="24s" repeatCount="indefinite" /></rect></clipPath><clipPath id="terminalLine2"><rect x="35" y="11" width="0" height="29"><animate attributeName="width" values="0;0;306;306;0;0" keyTimes="0;0.33333;0.38233;0.488;0.5;1" dur="24s" repeatCount="indefinite" /></rect></clipPath><clipPath id="terminalLine3"><rect x="35" y="11" width="0" height="29"><animate attributeName="width" values="0;0;333.2;333.2;0;0" keyTimes="0;0.5;0.549;0.65467;0.66667;1" dur="24s" repeatCount="indefinite" /></rect></clipPath><clipPath id="terminalLine4"><rect x="35" y="11" width="0" height="29"><animate attributeName="width" values="0;0;346.8;346.8;0;0" keyTimes="0;0.66667;0.71567;0.82133;0.83333;1" dur="24s" repeatCount="indefinite" /></rect></clipPath><clipPath id="terminalLine5"><rect x="35" y="11" width="0" height="29"><animate attributeName="width" values="0;0;414.8;414.8;0" keyTimes="0;0.83333;0.88233;0.988;1" dur="24s" repeatCount="indefinite" /></rect></clipPath></defs>
